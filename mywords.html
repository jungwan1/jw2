.c{background:#fff;border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:0 2px 8px #0001}.ru{font-family:"PT Sans",sans-serif;font-weight:400;cursor:pointer;color:#1f3f7a}.w{font-size:22px}.ko{font-size:13px;color:#888;margin-top:2px}.ex{margin-top:10px;font-size:16px}.exko{font-size:12px;color:#999}.db{display:flex;align-items:center;width:100%;box-sizing:border-box;text-align:left;background:#fff;border:2px solid #f0b48a;border-radius:16px;padding:14px 18px;margin:12px 0;box-shadow:0 4px 0 #e8a06e,0 6px 14px #0001;cursor:pointer;font:inherit;color:inherit}.db:active{transform:translateY(3px);box-shadow:0 1px 0 #e8a06e}.db .t{flex:1}.db b{font-size:18px}.db small{display:block;font-family:"PT Sans",sans-serif;font-size:13px;color:#999;margin-top:4px}.db .ar{font-size:26px;color:#d96f32;transition:transform .2s}.db.open .ar{transform:rotate(90deg)}.box{display:none;margin-bottom:18px}.box.open{display:block}.dt{font-size:12px;border:1.5px solid #f0b48a;background:#fff7ed;color:#c25f22;border-radius:10px;padding:4px 10px;margin-left:10px;box-shadow:0 2px 0 #e8a06e;cursor:pointer;vertical-align:middle;font-family:inherit}.dt:active{transform:translateY(2px);box-shadow:none}.det{display:none;margin-top:10px;border-top:1px dashed #f0d5bd;padding-top:8px}.det.open{display:block}.det h4{font-size:12px;color:#8a6a52;margin:8px 0 4px}.det table{border-collapse:collapse;width:100%;font-size:14px}.det td{border:1px solid #f3e1d0;padding:4px 8px}.det td.l{color:#888;font-size:12px;width:30%;background:#fffaf5}.det .n{font-size:13px;color:#555;margin-top:8px;line-height:1.5}.det .al{font-size:14px;margin:3px 0}.det .al small{color:#888;font-size:12px}</style></head>
<body><div class="wrap"><a class="home" href="index.html">‹ 메인</a><h1>📒 내 단어장</h1><div id="list"></div>
<p style="font-size:12px;color:#aaa">러시아어를 누르면 소리가 나와요.</p></div>
<script src="grammar/tts.js"></script>
<script>
const g={};WORDS.forEach(w=>(g[w.d]=g[w.d]||[]).push(w));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const det=d=>{if(!d)return '';let h='';(d.tb||[]).forEach(t=>{h+='<h4>'+esc(t[0])+'</h4><table>'+t[1].map(r=>'<tr>'+(r[0]?'<td class="l">'+esc(r[0])+'</td>':'')+'<td class="ru">'+esc(r[1])+'</td></tr>').join('')+'</table>'});if(d.n)h+='<div class="n">💡 '+esc(d.n)+'</div>';if(d.alt&&d.alt.length)h+='<h4>대체 가능 단어</h4>'+d.alt.map(a=>'<div class="al"><span class="ru">'+esc(a[0])+'</span> <small>— '+esc(a[1])+'</small></div>').join('');return h};
const card=w=>'<div class="c"><div><span class="ru w" data-s="'+esc(w.ru.replace(/\+.*$/,''))+'">'+esc(w.ru)+'</span>'+(w.det?'<button class="dt" onclick="this.closest(\'.c\').querySelector(\'.det\').classList.toggle(\'open\')">자세히 보기</button>':'')+'</div><div class="ko">'+esc(w.ko)+'</div><div class="ex"><span class="ru">'+esc(w.ex)+'</span><div class="exko">'+esc(w.exko)+'</div></div>'+(w.det?'<div class="det">'+det(w.det)+'</div>':'')+'</div>';
const main=d=>{const m=g[d].filter(w=>!/[+?]/.test(w.ru)).slice(0,4).map(w=>w.ru.replace(/ \(.*$/,''));return m.join(' · ');};
document.getElementById('list').innerHTML=Object.keys(g).sort().reverse().map(d=>'<button class="db" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'open\')"><span class="t"><b>'+d+'</b> <span style="font-size:13px;color:#b9a08a">'+g[d].length+'개</span><small>'+esc(main(d))+'</small></span><span class="ar">›</span></button><div class="box">'+g[d].map(card).join('')+'</div>').join('');
</script></body></html>
