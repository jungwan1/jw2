<body><div class="wrap"><a class="home" href="index.html?v=5">🏠 홈으로</a>
<h1>📖 일용할 성구</h1><div class="date">Воскресенье, 1 ноября (2026년 11월 1일 일요일)</div>
<div class="card"><div class="verse">«Я не буду гневаться вечно» (Иер. 3:12).</div><div class="ko">내가 영원히 분노하지는 않을 것이다. — 예레미야 3:12</div></div>
<div class="card"><div class="ctl">문장을 누르면 남자 목소리로 읽어줘요. 속도 <select id="rate"><option>0.7</option><option selected>0.85</option><option>1</option></select> (강세는 러시안그램으로 확인했습니다)</div><div id="body"></div>
<button class="gbtn" id="gb" onclick="tg()">문법해설 ▾</button><div id="gram" style="display:none"></div></div>
<div class="src">출처: JW 온라인 라이브러리 «Исследуем Писание каждый день 2026» 2026-11-01 러시아어 일용할 성구 (wol.jw.org에서 가져옴) · <a href="https://wol.jw.org/ru/wol/h/r2/lp-u/2026/11/1" target="_blank" rel="noopener">러시아어 원문 페이지 열기</a></div></div>
<script>
const DAILY_RU=["«Я не бу́ду гне́ваться ве́чно» (Иер. 3:12).", "Старе́йшины стара́ются подража́ть Иего́ве, кото́рый проявля́ет сострада́ние к тем, кто был удалён из собра́ния.", "Наприме́р, в дре́вности Бог не ждал, когда́ его́ сби́вшийся с пути́ наро́д осозна́ет свою́ вину́ и вернётся к нему́.", "Он пе́рвый де́лал шаг навстре́чу.", "Он посыла́л к израильтя́нам свои́х проро́ков, хотя́ те ещё не проявля́ли никаки́х при́знаков раска́яния.", "Так, Иего́ва сказа́л Оси́и прости́ть свою́ жену́ и приня́ть её обра́тно, хотя́ она́ ещё греши́ла (Ос. 3:1).", "Таки́м о́бразом Бог показа́л своему́ наро́ду, что он о́чень сострада́тельный (Мал. 3:7).", "Так же как Иего́ва, старе́йшины и́скренне хотя́т, что́бы согреши́вший верну́лся, и не усложня́ют ему́ путь обра́тно.", "В при́тче Иису́са о сы́не, кото́рый «был поте́рян и нашёлся», оте́ц, уви́дев сы́на, «побежа́л ему́ навстре́чу, обня́л его́ и поцелова́л» (Луки́ 15:20).", "Заме́тьте, что оте́ц не стал ждать, пока́ сын подойдёт к нему́ и бу́дет умоля́ть о проще́нии.", "Нет, он сде́лал то, что на его́ ме́сте сде́лал бы любо́й хоро́ший оте́ц, — поспеши́л навстре́чу сы́ну, потому́ что люби́л его́."];
const DAILY_GRAMMAR=[["Я не бу́ду гне́ваться: бу́ду + 불완료체 부정사 = 합성 미래 '화를 내지 않을 것이다'. 부정어 не는 бу́ду 앞에 와요.", "гне́ваться: -ся가 붙은 재귀동사로 '화내다, 노하다'예요.", "ве́чно: 부사 '영원히'. 부정문과 함께 '영원히 ~하지는 않다'는 뜻이에요.", "<b>원형·대체 가능 단어:</b> 원형 гне́ваться(화내다)·ве́чный(영원한) · 대체: гне́ваться → серди́ться(화내다)"], ["Старе́йшины стара́ются подража́ть: стара́ться + 부정사 '~하려고 애쓰다'. подража́ть는 여격을 받아서 Иего́ве가 여격이에요.", "кото́рый проявля́ет сострада́ние: Иего́ве를 꾸미는 관계절. проявля́ть сострада́ние = '동정심을 나타내다'.", "к тем, кто был удалён из собра́ния: проявля́ть ... к + 여격 '~에게'. те, кто ~ = '~한 사람들'. был удалён은 수동 짧은 분사 과거 '내보내졌다'.", "из собра́ния: из + 생격 '회중에서'.", "<b>원형·대체 가능 단어:</b> 원형 подража́ть(본받다)·удали́ть(내보내다, 제거하다) · 대체: подража́ть Иего́ве → брать приме́р с Иего́вы(여호와를 본보기로 삼다)"], ["Наприме́р, в дре́вности: 삽입어 '예를 들어' + в + 전치격 '옛날에'.", "Бог не ждал, когда́ ...: ждать, когда́ + 절 = '~할 때까지 기다리다'. 부정 не ждал = '기다리지 않았다'.", "его́ сби́вшийся с пути́ наро́д: сби́ться с пути́(길에서 벗어나다)의 능동 과거분사가 наро́д(남성 주격)를 꾸며요.", "осозна́ет свою́ вину́ и вернётся к нему́: 완료체 미래 두 개(осозна́ть, верну́ться). верну́ться к + 여격 '~에게 돌아가다'.", "<b>원형·대체 가능 단어:</b> 원형 осозна́ть(깨닫다)·верну́ться(돌아오다) · 대체: осозна́ет свою́ вину́ → раска́ется(회개하다)"], ["Он пе́рвый: пе́рвый가 주어 Он과 일치해서 '그분이 먼저(첫 번째로)'라는 뜻이에요.", "де́лал шаг навстре́чу: 불완료체 과거로 반복된 행동 '(늘) 다가가셨다'. де́лать шаг навстре́чу = '먼저 손을 내밀다, 다가가다'.", "навстре́чу: 부사/전치사 '마주 향하여'. 여기선 부사로 쓰였어요.", "<b>원형·대체 가능 단어:</b> 원형 де́лать(하다)·шаг(걸음) · 대체: пе́рвый де́лал шаг → проявля́л инициати́ву(솔선했다)"], ["посыла́л к израильтя́нам: посыла́ть к + 여격 '~에게 보내다'. 불완료체라 '거듭 보내셨다'예요.", "свои́х проро́ков: 활동체 복수 대격이라 생격과 같은 형태예요.", "хотя́ те ещё не ...: хотя́ = '~인데도', те = '그들(앞에 나온 이스라엘 사람들)'.", "не проявля́ли никаки́х при́знаков: 부정문에서 목적어가 생격(никаки́х при́знаков)으로 바뀌어요. раска́яния도 생격 '회개의'.", "<b>원형·대체 가능 단어:</b> 원형 посыла́ть(보내다)·раска́яние(회개) · 대체: при́знаков раска́яния → жела́ния раска́яться(회개하려는 마음)"], ["Так, ...: 문두 Так은 '예를 들어, 이처럼'으로 예를 드는 말이에요.", "сказа́л Оси́и прости́ть ...: сказа́ть + 여격(Оси́и) + 부정사 = '~에게 …하라고 말하다'.", "прости́ть свою́ жену́ и приня́ть её обра́тно: 완료체 부정사 두 개. приня́ть обра́тно = '다시 받아들이다'.", "хотя́ она́ ещё греши́ла: 불완료체 과거 '아직 죄를 짓고 있었다'.", "<b>원형·대체 가능 단어:</b> 원형 прости́ть(용서하다)·греши́ть(죄짓다) · 대체: приня́ть её обра́тно → верну́ть её(그녀를 다시 데려오다)"], ["Таки́м о́бразом: '이렇게 하여, 이와 같이' 관용구예요(조격).", "показа́л своему́ наро́ду: показа́ть + 여격 '~에게 보여 주다'. своему́ наро́ду는 남성 여격.", "что он о́чень сострада́тельный: что절 '~라는 것을'. 형용사 장어미형을 술어로 썼어요.", "<b>원형·대체 가능 단어:</b> 원형 показа́ть(보여 주다)·сострада́тельный(동정심 많은) · 대체: сострада́тельный → милосе́рдный(자비로운)"], ["Так же как Иего́ва: '여호와와 마찬가지로' 비교 표현이에요.", "хотя́т, что́бы согреши́вший верну́лся: хоте́ть, что́бы + 과거형 = '~하기를 원하다'(주어가 다를 때). согреши́вший는 능동 과거분사가 명사로 쓰여 '죄를 지은 사람'.", "не усложня́ют ему́ путь обра́тно: усложня́ть + 여격(ему́) + 대격(путь) = '~에게 …를 어렵게 만들다'.", "<b>원형·대체 가능 단어:</b> 원형 согреши́ть(죄를 짓다)·усложня́ть(복잡하게 하다) · 대체: не усложня́ют → облегча́ют(쉽게 해 준다)"], ["В при́тче Иису́са о сы́не: в + 전치격 '비유에서', о + 전치격 '아들에 대한'.", "кото́рый «был поте́рян и нашёлся»: 수동 짧은 분사 поте́рян(잃어버려졌다) + 재귀 완료체 과거 нашёлся(찾아졌다).", "уви́дев сы́на: 완료체 부동사 '아들을 보고서'. 주절 주어 оте́ц와 같은 사람이 한 동작이에요.", "побежа́л ему́ навстре́чу: навстре́чу + 여격 '~를 맞으러'. 이어서 обня́л, поцелова́л가 완료체 과거로 연달아 나와요.", "<b>원형·대체 가능 단어:</b> 원형 уви́деть(보다)·обня́ть(껴안다) · 대체: побежа́л → бро́сился(달려갔다)"], ["Заме́тьте: заме́тить의 명령형(존칭·복수) '주목하십시오'.", "не стал ждать: не стать + 부정사 = '~하지 않았다(그러려 하지 않았다)'.", "пока́ сын подойдёт: пока́ + 완료체 미래 = '~할 때까지'. 원래 пока́ не ~ 형태도 쓰여요.", "бу́дет умоля́ть о проще́нии: 합성 미래 + умоля́ть о + 전치격 '~을 간청하다'.", "<b>원형·대체 가능 단어:</b> 원형 подойти́(다가오다)·умоля́ть(간청하다) · 대체: умоля́ть о проще́нии → проси́ть проще́ния(용서를 구하다)"], ["Нет, ...: 앞 문장을 부정하며 '아니, 오히려'로 시작해요.", "он сде́лал то, что ...: то, что = '~한 것'. 앞 то가 대격 목적어예요.", "на его́ ме́сте сде́лал бы: 가정법 бы + 과거형 '그의 입장이라면 했을 것이다'. на чьём-то ме́сте = '~의 입장에서'.", "— поспеши́л навстре́чу сы́ну: 대시 뒤에 то의 내용을 풀어 줘요. навстре́чу + 여격(сы́ну).", "потому́ что люби́л его́: 이유절 '그를 사랑했기 때문에'. 불완료체 과거로 지속된 사랑이에요.", "<b>원형·대체 가능 단어:</b> 원형 сде́лать(하다)·поспеши́ть(서두르다) · 대체: поспеши́л → побежа́л(달려갔다)"]];
const clean=s=>s.normalize('NFD').replace(/\u0301/g,'').normalize('NFC');
let ruVoices=[];function lv(){ruVoices=speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang));}
if('speechSynthesis' in window){lv();speechSynthesis.onvoiceschanged=lv;}
function sp(i,el){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(DAILY_RU[i]));u.lang='ru-RU';u.rate=+document.getElementById('rate').value;
const m=ruVoices.find(v=>/male|dmitri|yuri|pavel|maxim/i.test(v.name)&&!/female/i.test(v.name));if(m)u.voice=m;else{if(ruVoices[0])u.voice=ruVoices[0];u.pitch=0.7;}
document.querySelectorAll('.ru.playing').forEach(e=>e.classList.remove('playing'));el.classList.add('playing');u.onend=u.onerror=()=>el.classList.remove('playing');speechSynthesis.speak(u);}
function tg(){const g=document.getElementById('gram'),o=g.style.display!=='none';g.style.display=o?'none':'block';document.getElementById('gb').textContent=o?'문법해설 ▾':'문법해설 ▴';}
document.getElementById('body').innerHTML=DAILY_RU.map((s,i)=>`<span class="ru" onclick="sp(${i},this)">${s}</span>`).join(' ');
document.getElementById('gram').innerHTML=DAILY_RU.map((s,i)=>`<div class="gSec"><div class="gT">문장 ${i+1}. ${s}</div><ul>${DAILY_GRAMMAR[i].map(b=>`<li>${b}</li>`).join('')}</ul></div>`).join('');
</script></body></html>
